apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-namespace
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/name: demo-namespace
    app.kubernetes.io/part-of: rhoai-platform
    app.kubernetes.io/component: platform
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/dandawg/rhoai-deploy.git
    targetRevision: main
    path: platform/demo-namespace
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
