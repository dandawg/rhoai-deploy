# Syncs MinIO root credentials from minio/minio-secret into demo/minio-dspa-connection
# using the key names expected by the DataSciencePipelinesApplication in rhoai-distributed.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: minio-dspa-connection
  namespace: demo
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: minio-namespace
    kind: ClusterSecretStore
  target:
    name: minio-dspa-connection
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: minio-secret
        property: MINIO_ROOT_USER
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: minio-secret
        property: MINIO_ROOT_PASSWORD
