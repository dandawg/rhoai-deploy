# Reads secrets from the minio namespace using the eso-minio-reader ServiceAccount.
# The ExternalSecret below uses this store to sync minio root credentials into demo.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: minio-namespace
spec:
  provider:
    kubernetes:
      remoteNamespace: minio
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: minio
      auth:
        serviceAccount:
          name: eso-minio-reader
          namespace: external-secrets-operator
