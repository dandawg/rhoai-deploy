apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: openshift-ai-inference
  namespace: openshift-ingress
spec:
  gatewayClassName: data-science-gateway-class
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        # Use the same TLS Secret as RHOAI's data-science-gateway (exists in openshift-ingress on RHOAI 3.x).
        certificateRefs:
          - group: ""
            kind: Secret
            name: data-science-gateway-service-tls
      allowedRoutes:
        namespaces:
          from: All
