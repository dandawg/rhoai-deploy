# Base size; use overlays/large for a larger PVC (set before first bind if possible).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-pvc
  annotations:
    # Same wave as Deployment — WaitForFirstConsumer storage won't bind until the
    # consumer pod exists; an earlier wave deadlocks under Argo CD (PVC never Bound).
    argocd.argoproj.io/sync-wave: "10"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 60Gi
  volumeMode: Filesystem
